[build]
  command = "npm run build && node scripts/ping-indexnow.cjs"
  publish = "out"

[[redirects]]
  from = "http://vividyard.com/*"
  to = "https://vividyard.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vividyard.com/*"
  to = "https://vividyard.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vividyard.com/*"
  to = "https://vividyard.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Content-Security-Policy   = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    Cache-Control             = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
